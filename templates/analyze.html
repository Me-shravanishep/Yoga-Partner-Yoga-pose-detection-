<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyze Video • Yoga Partner</title>

    <!-- Global CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Analyze Page CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/analyze.css') }}">

    <script>
        async function analyzeVideo(e) {
            e.preventDefault();

            const url = document.getElementById('videoUrl').value.trim();
            const pose = document.getElementById('targetPose').value;

            if (!url) {
                alert("Please enter a video URL");
                return;
            }

            document.getElementById('result').textContent =
                "Analyzing video... please wait.";

            try {
                const res = await fetch('/api/analyze_video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, target_pose: pose })
                });

                const data = await res.json();
                document.getElementById('result').textContent =
                    JSON.stringify(data, null, 2);

            } catch (err) {
                document.getElementById('result').textContent =
                    "Error: " + err.message;
            }
        }

        function previewVideo() {
            const url = document.getElementById('videoUrl').value.trim();
            const video = document.getElementById('videoPlayer');
            if (url) {
                video.src = url;
                video.load();
            }
        }
    </script>
</head>

<body>

<nav class="nav-menu">
    <div class="container">
        <div class="logo">🧘 Yoga Partner</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/analyze">Analyze</a></li>
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/login">Login</a></li>
        </ul>
    </div>
</nav>

<main class="analyze-page">

    <header class="analyze-header">
        <h1>Analyze Yoga Video</h1>
        <p>Upload a video URL and check pose correctness using AI</p>
    </header>

    <section class="analyze-grid">

        <!-- LEFT: FORM -->
        <div class="analyze-card">
            <h3>Video Input</h3>

            <form class="analyze-form" onsubmit="analyzeVideo(event)">
                <label for="videoUrl">Video URL</label>
                <input
                    type="text"
                    id="videoUrl"
                    placeholder="https://example.com/video.mp4"
                    onblur="previewVideo()"
                >

                <label for="targetPose">Target Pose</label>
                <select id="targetPose">
                    <option value="mountain">Mountain</option>
                    <option value="warrior1">Warrior I</option>
                    <option value="warrior2">Warrior II</option>
                    <option value="tree">Tree</option>
                    <option value="downdog">Downward Dog</option>
                    <option value="plank">Plank</option>
                </select>

                <div class="analyze-actions">
                    <button type="submit" class="analyze-btn">
                        Analyze
                    </button>
                    <button
                        type="button"
                        class="analyze-btn secondary"
                        onclick="previewVideo()">
                        Preview
                    </button>
                </div>
            </form>
        </div>

        <!-- RIGHT: VIDEO + RESULT -->
        <div class="analyze-card">
            <h3>Preview</h3>
            <video
                id="videoPlayer"
                class="analyze-video"
                controls
                crossorigin="anonymous">
            </video>

            <h3 style="margin-top:1.2rem;">Results</h3>
            <pre id="result" class="analyze-result">
No analysis yet.
            </pre>
        </div>

    </section>

</main>

<footer>
    <div class="container">
        <p>&copy; 2025 TEAM CODEASTRA</p>
    </div>
</footer>

</body>
</html>
